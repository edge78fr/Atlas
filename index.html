<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#m{height:100%;margin:0}
#p{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:8px 10px;border-radius:8px;font:13px system-ui,sans-serif;box-shadow:0 1px 6px #0006;width:280px;max-height:calc(100% - 40px);overflow:auto}
#p.ferme #corps{display:none}
#tete{display:flex;align-items:center;justify-content:space-between;gap:6px}#tete b{font-size:14px}
#p button{font:12px system-ui,sans-serif;cursor:pointer;border:1px solid #bbb;background:#f6f6f6;border-radius:4px;padding:2px 6px}
#p button:hover{background:#e8e8e8}#p button.on{background:#2a6;color:#fff;border-color:#2a6}
.sec{border-top:1px solid #ddd;margin-top:7px;padding-top:6px}
.sec h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;color:#666;letter-spacing:.04em}
.fonds label{display:inline-block;margin:2px 8px 2px 0}
details.dep{margin:2px 0;border-radius:5px}
details.dep>summary{cursor:pointer;padding:3px 4px;font-weight:600;background:#f3f3f3;border-radius:5px;list-style:none;display:flex;justify-content:space-between}
details.dep>summary::-webkit-details-marker{display:none}
details.dep>summary:before{content:'▸ ';color:#888}details.dep[open]>summary:before{content:'▾ '}
.plan{display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:4px;margin:3px 0 3px 6px}
.plan .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.plan .nom:hover{text-decoration:underline}
.plan input[type=range]{grid-column:2/5;width:100%;height:14px;margin:0;display:none}.plan.actif input[type=range]{display:block}
.badge{font-size:11px;cursor:help}
#filtre{width:100%;box-sizing:border-box;font:12px system-ui;padding:3px 5px;border:1px solid #bbb;border-radius:4px;margin-bottom:4px}
#rech{display:flex;gap:4px}#rech input{flex:1;min-width:0;font:12px system-ui;padding:3px 5px;border:1px solid #bbb;border-radius:4px}
#res div{padding:3px 4px;cursor:pointer;border-radius:3px;font-size:12px}#res div:hover{background:#eef}
.outils{display:flex;flex-wrap:wrap;gap:4px}
#info{font-size:12px;color:#333;margin-top:4px;min-height:16px}
#rideau{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 4px #000a;z-index:900;cursor:ew-resize;display:none}
#rideau span{position:absolute;top:50%;left:-13px;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#fff;box-shadow:0 0 4px #000a;text-align:center;line-height:30px;font:bold 14px system-ui;user-select:none}
.leaflet-container.mesure{cursor:crosshair}
.cp{font:12px system-ui}.cp button{font:11px system-ui;margin-top:4px}
.contour-lbl{background:#fffd;border:1px solid #c60;color:#630;font:600 11px system-ui;padding:1px 4px;border-radius:3px;box-shadow:none}
#lock{position:fixed;inset:0;z-index:5000;background:#1d2228;display:flex;align-items:center;justify-content:center;font:14px system-ui,sans-serif}
#lock form{background:#fff;padding:22px 24px;border-radius:10px;width:300px;max-width:88vw;box-shadow:0 4px 20px #0008}
#lock h2{margin:0 0 6px;font-size:18px}#lock p{margin:0 0 12px;color:#555;font-size:13px}
#lock input[type=password]{width:100%;box-sizing:border-box;font:16px monospace;padding:8px;border:1px solid #aaa;border-radius:6px;letter-spacing:.05em}
#lock button{margin-top:10px;width:100%;padding:8px;font:600 14px system-ui;background:#2a6;color:#fff;border:0;border-radius:6px;cursor:pointer}
#lock .err{color:#c00;min-height:18px;font-size:13px;margin-top:6px}
</style></head><body>
<div id="lock"><form id="lockf"><h2>🔒 Atlas</h2><p>Accès réservé. Entre le code d'accès.</p>
<input id="code" type="password" autocomplete="current-password" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" autofocus>
<label style="display:block;margin-top:8px;font-size:13px"><input id="memo" type="checkbox"> Se souvenir sur cet appareil</label>
<button type="submit">Déverrouiller</button><div class="err" id="lerr"></div></form></div>
<div id="m"></div><div id="rideau"><span>⇔</span></div>
<div id="p">
 <div id="tete"><b>Atlas</b><button id="pli" title="Replier / déplier le menu">☰</button></div>
 <div id="corps">
  <div class="sec"><h4>Rechercher un lieu</h4>
   <div id="rech"><input id="q" placeholder="Adresse, lieu, commune…"><button id="go">🔍</button></div><div id="res"></div></div>
  <div class="sec"><h4>Fond de carte</h4><div class="fonds">
   <label><input type="radio" name="b" value="o" checked> Photo</label>
   <label><input type="radio" name="b" value="l"> Relief LiDAR</label>
   <label><input type="radio" name="b" value="p"> Plan</label>
   <label><input type="radio" name="b" value="w"> Fond blanc</label></div>
   <label><input id="cad" type="checkbox"> Cadastre (parcelles IGN)</label><br>
   <label><input id="cont" type="checkbox" checked> Contours des plans</label></div>
  <div class="sec"><h4>Plans <span id="nbp" style="text-transform:none;color:#999"></span></h4>
   <input id="filtre" placeholder="Filtrer les plans…"><div id="plans">Chargement…</div>
   <button id="tout0" title="Décharger tous les plans">Tout décharger</button></div>
  <div class="sec"><h4>Outils</h4><div class="outils">
   <button id="bPos">📍 Ma position</button>
   <button id="bMes" title="Clique pour poser des points, double-clic ou Échap pour finir">📏 Mesurer</button>
   <button id="bRid" title="Comparer le plan et le fond avec une barre à glisser">⇔ Rideau</button>
   <button id="bLien" title="Copier un lien vers la vue actuelle">🔗 Lien</button>
   <button id="bLock" title="Oublier le code sur cet appareil">🔒 Verrouiller</button></div>
   <div id="info">Clique sur un contour orange ou un nom pour charger un plan.</div></div>
 </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const g=(l,s,f)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${l}&STYLE=${s}&FORMAT=${f}&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const store={get(k,d){try{const v=localStorage.getItem('atlas2_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('atlas2_'+k,JSON.stringify(v))}catch(e){}}};
const map=L.map('m',{zoomControl:true,maxZoom:22,zoomSnap:0.5,wheelPxPerZoomLevel:90});
map.createPane('plans').style.zIndex=250;map.createPane('cadp').style.zIndex=300;map.createPane('cont').style.zIndex=350;
const fondOpt={maxZoom:22,maxNativeZoom:18,keepBuffer:1,updateWhenZooming:false};
const B={o:L.tileLayer(g('ORTHOIMAGERY.ORTHOPHOTOS','normal','image/jpeg'),{...fondOpt,maxNativeZoom:19,attribution:'IGN'}),
l:L.tileLayer(g('IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.SHADOW','normal','image/png'),{...fondOpt,attribution:'IGN'}),
p:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{...fondOpt,maxNativeZoom:19,attribution:'© OpenStreetMap'}),
w:L.tileLayer('data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==',{maxZoom:22})};
let fond=store.get('fond','o');if(!B[fond])fond='o';B[fond].addTo(map);
document.querySelectorAll('[name=b]').forEach(r=>{r.checked=r.value===fond;r.onchange=()=>{Object.values(B).forEach(x=>map.removeLayer(x));B[r.value].addTo(map);store.set('fond',r.value)}});
const cd=L.tileLayer(g('CADASTRALPARCELS.PARCELLAIRE_EXPRESS','PCI%20vecteur','image/png'),{maxZoom:22,maxNativeZoom:19,pane:'cadp',keepBuffer:1});
const cadCb=document.getElementById('cad');cadCb.checked=store.get('cad',false);if(cadCb.checked)cd.addTo(map);
cadCb.onchange=e=>{e.target.checked?cd.addTo(map):map.removeLayer(cd);store.set('cad',e.target.checked)};
function lireHash(){const m=location.hash.match(/^#(\d+(?:\.\d+)?)\/(-?\d+\.\d+)\/(-?\d+\.\d+)/);return m?[+m[2],+m[3],+m[1]]:null}
const h=lireHash()||store.get('vue',null)||[48.98,2.08,11];map.setView([h[0],h[1]],h[2]);
map.on('moveend',()=>{const c=map.getCenter(),z=map.getZoom();history.replaceState(null,'',`#${z}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`);store.set('vue',[c.lat,c.lng,z])});
window.addEventListener('hashchange',()=>{const v=lireHash();if(v)map.setView([v[0],v[1]],v[2])});
const pan=document.getElementById('p');if(store.get('ferme',window.innerWidth<600))pan.classList.add('ferme');
document.getElementById('pli').onclick=()=>{pan.classList.toggle('ferme');store.set('ferme',pan.classList.contains('ferme'))};
L.DomEvent.disableClickPropagation(pan);L.DomEvent.disableScrollPropagation(pan);
const info=document.getElementById('info');
const copier=t=>{try{navigator.clipboard.writeText(t);return true}catch(e){return false}};


// ---------- chiffrement : rien n'est lisible sans le code ----------
const te=new TextEncoder(),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
let EK=null,NK=null;
async function cles(dk){const base=await crypto.subtle.importKey('raw',dk,'HKDF',false,['deriveKey']);
 const prm=i=>({name:'HKDF',hash:'SHA-256',salt:te.encode('atlas-v1'),info:te.encode(i)});
 EK=await crypto.subtle.deriveKey(prm('enc'),base,{name:'AES-GCM',length:256},false,['decrypt']);
 NK=await crypto.subtle.deriveKey(prm('name'),base,{name:'HMAC',hash:'SHA-256',length:256},false,['sign'])}
async function nomF(s){const h=new Uint8Array(await crypto.subtle.sign('HMAC',NK,te.encode(s)));return [...h.slice(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function lire(s){const n=await nomF(s);const r=await fetch(`t/${n.slice(0,2)}/${n}`);if(!r.ok)return null;const b=new Uint8Array(await r.arrayBuffer());
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},EK,b.slice(12))}
async function deverrouille(code){const L_=await (await fetch('lock.json',{cache:'no-store'})).json();
 const pk=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
 const kek=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(L_.salt),iterations:L_.iter},pk,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(L_.iv),additionalData:te.encode('atlas-lock')},kek,b64d(L_.wrapped))}
const CTile=L.GridLayer.extend({createTile(c,done){const img=document.createElement('img');img.alt='';img.style.visibility='hidden';
 lire(`${this.options.d}/${c.z}/${c.x}/${c.y}`).then(buf=>{if(!buf){done(null,img);return}const u=URL.createObjectURL(new Blob([buf],{type:'image/webp'}));
  img.onload=()=>{URL.revokeObjectURL(u);img.style.visibility='';done(null,img)};img.onerror=()=>done(null,img);img.src=u}).catch(()=>done(null,img));return img}});
const memDK=()=>{try{return sessionStorage.getItem('atlas_dk')||localStorage.getItem('atlas_dk')}catch(e){return null}};
async function demarre(dk){await cles(dk);const buf=await lire('plans.json');if(!buf)throw 'données';document.getElementById('lock').style.display='none';initPlans(JSON.parse(new TextDecoder().decode(buf)))}
document.getElementById('lockf').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('lerr');err.textContent='Vérification…';
 try{const dk=await deverrouille(document.getElementById('code').value.trim().toUpperCase());const s=b64e(dk);
  try{(document.getElementById('memo').checked?localStorage:sessionStorage).setItem('atlas_dk',s)}catch(_){}
  err.textContent='';await demarre(dk)}catch(x){err.textContent='Code incorrect.'}};
document.getElementById('bLock').onclick=()=>{try{localStorage.removeItem('atlas_dk');sessionStorage.removeItem('atlas_dk')}catch(e){}location.reload()};
(async()=>{const m=memDK();if(m){try{await demarre(b64d(m))}catch(e){try{localStorage.removeItem('atlas_dk');sessionStorage.removeItem('atlas_dk')}catch(_){}}}})();

// ---------- plans : chargement à la demande ----------
let P=[];const etat=store.get('plans',{});const contours=L.featureGroup();
const contCb=document.getElementById('cont');contCb.checked=store.get('cont',true);
contCb.onchange=()=>{contCb.checked?contours.addTo(map):map.removeLayer(contours);store.set('cont',contCb.checked)};
function sauve(){const o={};P.forEach(p=>{if(p.layer||p.op!==1)o[p.id]={on:!!p.layer,op:p.op}});store.set('plans',o)}
function charge(p,aller){
 if(!p.layer){p.layer=new CTile({d:p.d,minZoom:p.min||13,maxZoom:22,maxNativeZoom:p.nat||19,minNativeZoom:p.minNat||15,bounds:L.latLngBounds([p.bbox[1],p.bbox[0]],[p.bbox[3],p.bbox[2]]),pane:'plans',opacity:p.op,keepBuffer:1,updateWhenZooming:false}).addTo(map);
  p.ui.cb.checked=true;p.ui.row.classList.add('actif');p.poly&&p.poly.setStyle({fillOpacity:0,weight:1,dashArray:'4 4'})}
 if(p.extra&&!p.xl)chargeExtra(p);
 if(aller)map.fitBounds([[p.bbox[1],p.bbox[0]],[p.bbox[3],p.bbox[2]]],{maxZoom:17});
 sauve();majNb()}
function decharge(p){if(p.layer){map.removeLayer(p.layer);p.layer=null}if(p.xl){map.removeLayer(p.xl);p.xl=null}p.ui.cb.checked=false;p.ui.row.classList.remove('actif');p.poly&&p.poly.setStyle({fillOpacity:.15,weight:2,dashArray:null});sauve();majNb()}
const colT={salle:'#c0f',info:'#08f',pa:'#f00',pb:'#f60',vehicule:'#555',cao:'#0a0',caf:'#060',passage:'#fa0',elec:'#ff0',danger:'#f00'};
const colR={principal:'#e00',secondaire:'#f80',chemin:'#fc0'};
async function chargeExtra(p){p.xl=L.layerGroup().addTo(map);const bx=await lire('extra/'+p.extra);if(!bx||!p.xl)return;const j=JSON.parse(new TextDecoder().decode(bx));if(!p.xl)return;
 L.geoJSON(j,{pane:'cadp',style:f=>({color:colR[f.properties.type]||'#f80',weight:f.properties.type==='principal'?3:2,dashArray:f.properties.type==='chemin'?'4 4':null,opacity:.9}),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:'cadp',radius:5,color:'#fff',weight:1.5,fillColor:colT[f.properties.type]||'#08f',fillOpacity:1}),
  onEachFeature:(f,l)=>{if(f.properties.nom)l.bindTooltip(f.properties.nom)}}).addTo(p.xl)}
function majNb(){document.getElementById('nbp').textContent=`(${P.filter(p=>p.layer).length} chargé(s) / ${P.length})`}
function initPlans(j){
 P=j.plans;const box=document.getElementById('plans');box.innerHTML='';
 const deps=[...new Set(P.map(p=>p.dep))].sort();const ouverts=store.get('deps',{});
 deps.forEach(dep=>{const det=document.createElement('details');det.className='dep';det.open=!!ouverts[dep];
  const ps=P.filter(p=>p.dep===dep).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  det.innerHTML=`<summary><span>${dep}</span><span style="color:#999;font-weight:400">${ps.length}</span></summary>`;
  det.ontoggle=()=>{ouverts[dep]=det.open;store.set('deps',ouverts)};
  ps.forEach(p=>{const s=etat[p.id]||{on:false,op:1};p.op=s.op;
   const r=document.createElement('div');r.className='plan';r.dataset.nom=(p.nom+' '+dep).toLowerCase();
   r.innerHTML=`<input type="checkbox" title="Charger / décharger"><span class="nom" title="Aller sur ${p.nom}">${p.nom}</span><span class="badge" title="${p.t||''}">${p.ok||'•'}</span><button title="Aller sur ce plan">Aller</button><input type="range" min="0" max="1" step="0.05" value="${p.op}" title="Transparence">`;
   const [cb,nm,,bt,rg]=r.children;p.ui={cb,row:r};
   cb.onchange=()=>cb.checked?charge(p,false):decharge(p);
   nm.onclick=bt.onclick=()=>charge(p,true);
   rg.oninput=()=>{p.op=+rg.value;p.layer&&p.layer.setOpacity(p.op);sauve()};
   det.appendChild(r);
   if(p.contour){p.poly=L.polygon(p.multi?p.contour.map(r=>[r.map(c=>[c[1],c[0]])]):p.contour.map(c=>[c[1],c[0]]),{pane:'cont',color:'#d60',weight:2,fillColor:'#f90',fillOpacity:.15}).bindTooltip(p.nom,{sticky:true,className:'contour-lbl'});
    p.poly.on('click',e=>{L.DomEvent.stop(e);p.layer?decharge(p):charge(p,false)});contours.addLayer(p.poly)}
   if(s.on)charge(p,false)});
  box.appendChild(det)});
 if(contCb.checked)contours.addTo(map);majNb();
 if(new URLSearchParams(location.search).get('plan')){const p=P.find(x=>x.id===new URLSearchParams(location.search).get('plan'));p&&charge(p,true)}
}
document.getElementById('filtre').oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('details.dep').forEach(d=>{let n=0;d.querySelectorAll('.plan').forEach(r=>{const ok=!q||r.dataset.nom.includes(q);r.style.display=ok?'':'none';n+=ok});d.style.display=n?'':'none';if(q)d.open=true})};
document.getElementById('tout0').onclick=()=>P.forEach(p=>p.layer&&decharge(p));

// ---------- recherche ----------
const q=document.getElementById('q'),res=document.getElementById('res');
async function chercher(){const t=q.value.trim();if(!t)return;res.textContent='Recherche…';
 try{const r=await fetch('https://data.geopf.fr/geocodage/search?limit=5&q='+encodeURIComponent(t));const j=await r.json();res.innerHTML='';
  if(!j.features||!j.features.length){res.textContent='Aucun résultat';return}
  j.features.forEach(f=>{const d=document.createElement('div');d.textContent=f.properties.label;d.onclick=()=>{const [lo,la]=f.geometry.coordinates;map.setView([la,lo],17);res.innerHTML=''};res.appendChild(d)})}
 catch(e){res.textContent='Recherche indisponible'}}
document.getElementById('go').onclick=chercher;q.onkeydown=e=>{if(e.key==='Enter')chercher()};
// ---------- coordonnées ----------
let mesure=null;
map.on('click',e=>{if(mesure)return;const t=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
 const d=L.DomUtil.create('div','cp');d.innerHTML=`<b>${t}</b><br><button>Copier</button>`;
 d.querySelector('button').onclick=ev=>{ev.target.textContent=copier(t)?'Copié ✔':'Sélectionne le texte'};
 L.popup().setLatLng(e.latlng).setContent(d).openOn(map)});
// ---------- position ----------
let posM=null;
document.getElementById('bPos').onclick=()=>{info.textContent='Recherche de ta position…';map.locate({setView:true,maxZoom:18,enableHighAccuracy:true})};
map.on('locationfound',e=>{if(posM)map.removeLayer(posM);posM=L.layerGroup([L.circle(e.latlng,{radius:e.accuracy,weight:1,color:'#16f',fillOpacity:.1}),L.circleMarker(e.latlng,{radius:6,color:'#fff',weight:2,fillColor:'#16f',fillOpacity:1})]).addTo(map);info.textContent=`Position à ±${Math.round(e.accuracy)} m`});
map.on('locationerror',()=>info.textContent='Position indisponible (autorise la localisation)');
// ---------- mesure ----------
const bMes=document.getElementById('bMes');let couches=[];
function finMesure(){if(!mesure)return;map.getContainer().classList.remove('mesure');map.doubleClickZoom.enable();bMes.classList.remove('on');mesure=null}
const dist=pts=>{let s=0;for(let i=1;i<pts.length;i++)s+=pts[i-1].distanceTo(pts[i]);return s};
const fmt=m=>m<1000?m.toFixed(1)+' m':(m/1000).toFixed(2)+' km';
bMes.onclick=()=>{if(mesure){finMesure();return}couches.forEach(c=>map.removeLayer(c));couches=[];
 mesure={pts:[],ligne:L.polyline([],{color:'#e30',weight:3,dashArray:'6 4'}).addTo(map)};couches.push(mesure.ligne);
 map.getContainer().classList.add('mesure');map.doubleClickZoom.disable();bMes.classList.add('on');info.textContent='Clique pour poser des points, double-clic ou Échap pour finir.'};
map.on('click',e=>{if(!mesure)return;mesure.pts.push(e.latlng);mesure.ligne.setLatLngs(mesure.pts);couches.push(L.circleMarker(e.latlng,{radius:4,color:'#e30',fillOpacity:1}).addTo(map));info.textContent='Distance : '+fmt(dist(mesure.pts))});
map.on('dblclick',()=>{if(mesure){info.textContent='Distance totale : '+fmt(dist(mesure.pts))+' (re-clique 📏 pour effacer)';finMesure()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mesure){info.textContent='Distance totale : '+fmt(dist(mesure.pts));finMesure()}});
// ---------- rideau ----------
const rid=document.getElementById('rideau'),bRid=document.getElementById('bRid'),pane=map.getPane('plans');let ridX=null;
function clip(){if(ridX===null){pane.style.clip='';return}const nw=map.containerPointToLayerPoint([0,0]),se=map.containerPointToLayerPoint(map.getSize()),cx=map.containerPointToLayerPoint([ridX,0]).x;pane.style.clip=`rect(${nw.y}px,${cx}px,${se.y}px,${nw.x}px)`;rid.style.left=ridX+'px'}
bRid.onclick=()=>{if(ridX===null){ridX=map.getSize().x/2;rid.style.display='block';bRid.classList.add('on');info.textContent='Plans à gauche de la barre, fond seul à droite.'}else{ridX=null;rid.style.display='none';bRid.classList.remove('on')}clip()};
map.on('move zoom resize viewreset zoomend',clip);
let drag=false;const dep=e=>{if(!drag)return;const x=(e.touches?e.touches[0].clientX:e.clientX)-map.getContainer().getBoundingClientRect().left;ridX=Math.max(0,Math.min(map.getSize().x,x));clip();e.preventDefault()};
